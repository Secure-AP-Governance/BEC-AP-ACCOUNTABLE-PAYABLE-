name: RC-1 runtime

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  rc1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_invariants.py
      - run: python scripts/security_scan.py
      - run: python -m unittest discover -s tests -v
